# Deliberate exceptions to redocly.yaml (recommended-strict) for api/openapi.json.
api/openapi.json:
  # These public browser/scrape endpoints never answer 4xx: login failures
  # and rate limiting redirect back to /login?error=…, logout always
  # redirects, and /login and /metrics always render.
  operation-4xx-response:
    - '#/paths/~1auth~1login/post/responses'
    - '#/paths/~1auth~1logout/post/responses'
    - '#/paths/~1login/get/responses'
    - '#/paths/~1metrics/get/responses'
