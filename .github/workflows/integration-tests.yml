# VM-based integration tests (#117).
#
# Boots the same Lima VM developers use (dev/lima-linux.yaml), deploys
# dumpstore into it with `make install`, and runs tests/integration against
# the live API — real zpool/zfs/Ansible, no mocks.
#
# Triggers:
#   - nightly (cron)
#   - manually (workflow_dispatch)
#   - on PRs carrying the `run-integration` label
#
# Two jobs, same triggers: linux-vm (Ubuntu 24.04) and freebsd-vm (FreeBSD
# 15, amd64). Both run under Lima with KVM on ubuntu-latest; FreeBSD guests
# need Lima >= 2.1. The FreeBSD job runs `make ci-freebsd`, the same target
# as locally.
name: Integration Tests

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

env:
  # Same Lima as local development; FreeBSD guests need >= 2.1.
  LIMA_VERSION: "2.3.0"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vm:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and Lima
        run: |
          # Tolerate index failures from unrelated third-party repos on the
          # runner image; qemu comes from the default Ubuntu archive.
          sudo apt-get update -qq || true
          # ovmf: UEFI firmware Lima needs to boot x86_64 guests
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" \
            | sudo tar Cxz /usr/local
          limactl --version

      - name: Start Linux VM
        run: make vm-linux-start

      # Lima reports READY even when the provision script aborted half-way
      # (set -e on a failed apt step), and tests whose tool is missing would
      # then skip. Fail here instead, with the reason (#234).
      - name: Verify VM provisioning
        run: make vm-linux-verify

      - name: Deploy dumpstore into VM
        run: make vm-linux-deploy

      - name: Run integration tests
        env:
          # Every tool is provisioned (verified above): a missing one fails
          # its tests instead of skipping them.
          DUMPSTORE_REQUIRE_TOOLS: "1"
        run: make test-integration

      - name: Collect VM logs on failure
        if: failure()
        run: |
          tail -n 100 ~/.lima/dumpstore-linux/ha.stderr.log 2>/dev/null || true
          tail -n 50 ~/.lima/dumpstore-linux/serial*.log 2>/dev/null || true
          limactl shell --tty=false dumpstore-linux -- sudo journalctl -u dumpstore --no-pager -n 200 || true
          limactl shell --tty=false dumpstore-linux -- sudo zpool status || true

  freebsd-vm:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and Lima
        run: |
          sudo apt-get update -qq || true
          # xorriso: Lima builds the FreeBSD guest's cidata ISO with it on
          # non-macOS hosts.
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso
          curl -fsSL "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/lima-${LIMA_VERSION}-Linux-x86_64.tar.gz" \
            | sudo tar Cxz /usr/local
          limactl --version

      # Start, verify provisioning, deploy, and the suite with
      # DUMPSTORE_REQUIRE_TOOLS=1 — the same target developers run.
      - name: FreeBSD VM suite
        run: make ci-freebsd

      - name: Collect VM logs on failure
        if: failure()
        run: |
          tail -n 100 ~/.lima/dumpstore-freebsd/ha.stderr.log 2>/dev/null || true
          tail -n 80 ~/.lima/dumpstore-freebsd/serial*.log 2>/dev/null || true
          limactl shell --tty=false dumpstore-freebsd -- sudo tail -n 200 /var/log/messages || true
          limactl shell --tty=false dumpstore-freebsd -- sudo zpool status || true
