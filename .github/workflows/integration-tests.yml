# VM-based integration tests (#117, #234).
#
# Boots the same Lima VMs developers use (dev/lima-linux.yaml,
# dev/lima-freebsd.yaml), deploys dumpstore into each with `make install`, and
# runs tests/integration against the live API — real zpool/zfs/Ansible, no
# mocks. Both VMs run under Lima with KVM on ubuntu-latest; each job runs the
# same Makefile target as locally (`make ci-integration`, `make ci-freebsd`):
# provisioning verified, then the suite with DUMPSTORE_REQUIRE_TOOLS=1.
#
# When the suites run (dev/ci/integration-needed.sh):
#   - nightly (cron) and on manual dispatch: always
#   - pull requests: when the diff touches backend paths, or the PR carries
#     the `run-integration` label (applied on the next push; or dispatch the
#     workflow on the branch)
#
# The `integration` job is the single result to require in branch protection:
# it fails when a suite failed or was cancelled, and passes when the suites
# ran green or were not needed.
name: Integration Tests

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  # No `labeled`: an unrelated label would start a skipped run whose
  # `integration` result could mask a failing one, and cancel a running run.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: dev/ci/integration-needed.sh ${BASE:+"$BASE" "$HEAD"}

  linux-vm:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: KVM, QEMU and Lima
        run: dev/ci/vm-runner-setup.sh
      - name: Linux VM suite
        run: make ci-integration
      - name: Collect VM logs on failure
        if: failure()
        run: |
          tail -n 100 ~/.lima/dumpstore-linux/ha.stderr.log 2>/dev/null || true
          tail -n 50 ~/.lima/dumpstore-linux/serial*.log 2>/dev/null || true
          limactl shell --tty=false dumpstore-linux -- sudo journalctl -u dumpstore --no-pager -n 200 || true
          limactl shell --tty=false dumpstore-linux -- sudo zpool status || true

  freebsd-vm:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: KVM, QEMU and Lima
        run: dev/ci/vm-runner-setup.sh
      - name: FreeBSD VM suite
        run: make ci-freebsd
      - name: Collect VM logs on failure
        if: failure()
        run: |
          tail -n 100 ~/.lima/dumpstore-freebsd/ha.stderr.log 2>/dev/null || true
          tail -n 80 ~/.lima/dumpstore-freebsd/serial*.log 2>/dev/null || true
          limactl shell --tty=false dumpstore-freebsd -- sudo tail -n 200 /var/log/messages || true
          limactl shell --tty=false dumpstore-freebsd -- sudo zpool status || true

  integration:
    needs: [changes, linux-vm, freebsd-vm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Suites passed or were not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          LINUX: ${{ needs.linux-vm.result }}
          FREEBSD: ${{ needs.freebsd-vm.result }}
        run: |
          echo "changes=$CHANGES run=$RUN linux-vm=$LINUX freebsd-vm=$FREEBSD"
          [ "$CHANGES" = success ] || { echo "change detection did not succeed"; exit 1; }
          if [ "$RUN" = true ]; then
            [ "$LINUX" = success ] && [ "$FREEBSD" = success ]
          else
            echo "no backend changes: suites not needed"
          fi
