name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lints the committed, generated OpenAPI spec (#181). Freshness of
  # api/openapi.json against the route registry is enforced by
  # TestOpenAPISpec in build-and-test. Node is CI-only tooling here.
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: make ci-openapi-lint

  # Every job below runs one Makefile target; `make ci` runs the same targets
  # locally, so the two cannot drift. Tool versions are pinned in the Makefile.
  #
  # Generates a TypeScript SDK from the committed spec with Forge
  # (cloudflare/forge) and type-checks it (#181 Phase 4). Forge is not on npm
  # yet, so it is built from the commit pinned in the Makefile (FORGE_REV);
  # bump it deliberately and re-check the output. Fails on a Forge error, a
  # client without the API's groups, or a type error in the generated code.
  # Forge's code runs only from that pinned commit, fetched anonymously (no
  # repository credentials).
  forge-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forge revision (pinned in the Makefile)
        run: echo "FORGE_REV=$(make -s forge-rev)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            .cache/forge/target
          key: forge-${{ runner.os }}-${{ env.FORGE_REV }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # rustup installs the toolchain pinned in Forge's rust-toolchain.toml.
      - run: make ci-forge

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # build, vet (also with the integration tag and for FreeBSD), race tests
      - run: make ci-go

  # Syntax-checks every frontend ES module. A syntax error at module top level
  # stops the whole UI from loading (lessons.md #3), and `node --check` on a
  # .js file outside a "type":"module" package misses ESM errors — so each
  # file is checked as an .mjs copy (#234).
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: make ci-frontend

  # Exercises the exact release recipe (make release, all four GOOS/GOARCH
  # targets) so a broken release pipeline is caught on the PR, not at tag
  # time — the v0.1.14 tag build broke on drift nothing ever tested (#118).
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make ci-release
