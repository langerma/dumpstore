---
# smb_apply.yml — Atomically apply a fully rendered smb.conf and reload Samba.
#
# Called by dumpstore after rendering the complete config from its internal
# template. This playbook creates any referenced directories, deploys the
# rendered file, starts the services that are stopped and reloads the ones
# that were running. A reload
# re-reads smb.conf without dropping client connections; a restart per write
# trips systemd's start limit when several edits land within seconds.
#
# Required extra vars:
#   src             – path to the rendered smb.conf temp file
#   smb_conf        – destination path (e.g. /etc/samba/smb.conf)
#   dirs            – JSON list of directories to ensure exist (may be empty: [])
#   samba_services  – JSON list of service names to reload (or start)
#   service_manager – "systemd" (Linux) or "rc" (FreeBSD)
#
# Optional extra vars (Linux, set only when wsdd is installed and its unit
# reads $WSDD_PARAMS from an EnvironmentFile):
#   wsdd_src        – path to the rendered wsdd options temp file
#   wsdd_conf       – destination path (the unit's EnvironmentFile)
#   wsdd_unit       – wsdd systemd unit name
#   wsdd_restart    – "true" if wsdd was running; it is restarted only when
#                     its options file changed (wsdd has no reload). A stopped
#                     wsdd is left stopped and picks the file up on next start.

- name: Apply dumpstore Samba configuration
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert required variables are defined
      ansible.builtin.assert:
        that:
          - src is defined and src | length > 0
          - smb_conf is defined and smb_conf | length > 0
          - dirs is defined
          - samba_services is defined and samba_services | length > 0
          - service_manager is defined and service_manager in ['systemd', 'rc']
        fail_msg: "src, smb_conf, dirs, samba_services and service_manager (systemd|rc) are required"

    - name: Create referenced directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        mode: "0755"
      loop: "{{ dirs | from_json | default([]) }}"
      when: (dirs | from_json | default([])) | length > 0

    - name: Deploy smb.conf atomically
      ansible.builtin.copy:
        src: "{{ src }}"
        dest: "{{ smb_conf }}"
        owner: root
        mode: "0644"
        backup: true

    # Reload what is running, start what is stopped (#196): FreeBSD's
    # `service samba_server reload` fails while Samba is stopped. Status is
    # read with the OS's own command, not ansible.builtin.service — on
    # FreeBSD that module probes with `onestatus` and starts with
    # `onestart`, which for samba_server also force-starts winbindd (not
    # enabled without `idmap uid`), misreads a running Samba as stopped and
    # leaves an orphaned winbindd behind.
    - name: Check which Samba services are running
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-active', '--quiet', item] if service_manager == 'systemd' else ['service', item, 'status'] }}"
      loop: "{{ samba_services | from_json }}"
      register: samba_status
      changed_when: false
      failed_when: false

    - name: Reload running Samba services
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'reload', item.item] if service_manager == 'systemd' else ['service', item.item, 'reload'] }}"
      loop: "{{ samba_status.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc == 0

    - name: Start stopped Samba services
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'start', item.item] if service_manager == 'systemd' else ['service', item.item, 'start'] }}"
      loop: "{{ samba_status.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0

    - name: Deploy wsdd options
      ansible.builtin.copy:
        src: "{{ wsdd_src }}"
        dest: "{{ wsdd_conf }}"
        owner: root
        mode: "0644"
        backup: true
      register: wsdd_deploy
      when: (wsdd_conf | default('')) | length > 0

    - name: Restart wsdd
      ansible.builtin.service:
        name: "{{ wsdd_unit }}"
        state: restarted
      when:
        - wsdd_deploy is changed
        - (wsdd_restart | default('false')) == 'true'
