---
# Required extra vars:
#   username - login name of the user to delete
#   uid      - UID of the user (must be >= uid_min, validated in Go before calling)
#   uid_min  - lowest non-system UID/GID (system.UIDMin, i.e. UID_MIN from /etc/login.defs)

- name: Delete local user
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert required vars and safety
      ansible.builtin.assert:
        that:
          - username is defined and username != ""
          - uid is defined
          - uid | int >= uid_min | int
          - username not in ['nobody', 'nfsnobody']
        fail_msg: "username is required, uid must be >= {{ uid_min }}, and protected accounts (nobody, nfsnobody) cannot be deleted"

    - name: Delete user and home directory
      ansible.builtin.user:
        name: "{{ username }}"
        state: absent
        remove: true
        force: true
      register: delete_result
      retries: 5
      delay: 2
      until: delete_result is not failed
      changed_when: delete_result.changed
