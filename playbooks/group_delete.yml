---
# Required extra vars:
#   groupname - name of the group to delete
#   gid       - GID of the group (must be >= uid_min, validated in Go before calling)
#   uid_min   - lowest non-system UID/GID (system.UIDMin, i.e. UID_MIN from /etc/login.defs)

- name: Delete local group
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert required vars and safety
      ansible.builtin.assert:
        that:
          - groupname is defined and groupname != ""
          - gid is defined
          - gid | int >= uid_min | int
          - groupname not in ['nogroup', 'nobody', 'nfsnobody']
        fail_msg: "groupname is required, gid must be >= {{ uid_min }}, and protected groups (nogroup, nobody, nfsnobody) cannot be deleted"

    - name: Delete group
      ansible.builtin.group:
        name: "{{ groupname }}"
        state: absent
      register: delete_result
      retries: 5
      delay: 2
      until: delete_result is not failed
      changed_when: delete_result.changed
