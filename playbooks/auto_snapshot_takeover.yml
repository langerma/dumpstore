---
# Disable the OS auto-snapshot daemon so dumpstore can take over.
#
# Linux — zfs-auto-snapshot ships one of two schedulers, both handled:
#   cron (Debian/Ubuntu): /etc/cron.d/zfs-auto-snapshot (frequent) plus
#     /etc/cron.{hourly,daily,weekly,monthly}/zfs-auto-snapshot. Each is
#     renamed to <file>.dumpstore-disabled — cron.d and run-parts both skip
#     names containing a dot, and release renames them back, so nothing is
#     lost. dpkg leaves a missing conffile missing on upgrade.
#   systemd timers: zfs-auto-snapshot-<bucket>.timer. Only timers that are
#     enabled are stopped/disabled, and their names are recorded in
#     timer_state_file so release re-enables exactly those.
# FreeBSD: clear `daily_zfs_snapshot_enable="YES"` from /etc/periodic.conf.
#
# Required extra vars:
#   timer_state_file - where to record the timers this takeover disabled
#
# Idempotent: re-running is safe — a second takeover finds nothing enabled
# and keeps the earlier record.
- name: Take over auto-snapshot execution from the OS daemon
  hosts: localhost
  gather_facts: true
  vars:
    autosnap_cron_files:
      - /etc/cron.d/zfs-auto-snapshot
      - /etc/cron.hourly/zfs-auto-snapshot
      - /etc/cron.daily/zfs-auto-snapshot
      - /etc/cron.weekly/zfs-auto-snapshot
      - /etc/cron.monthly/zfs-auto-snapshot
    autosnap_known_timers:
      - zfs-auto-snapshot-frequent.timer
      - zfs-auto-snapshot-hourly.timer
      - zfs-auto-snapshot-daily.timer
      - zfs-auto-snapshot-weekly.timer
      - zfs-auto-snapshot-monthly.timer
    autosnap_enabled_timers: >-
      {{ (autosnap_timer_scan.stdout_lines | default([]))
         | map('split') | map('first')
         | select('in', autosnap_known_timers) | list }}
  tasks:
    - name: Assert required vars are defined
      ansible.builtin.assert:
        that:
          - timer_state_file is defined and timer_state_file | length > 0
        fail_msg: "timer_state_file is required"

    - name: Linux — detect enabled zfs-auto-snapshot systemd timers
      ansible.builtin.command:
        argv:
          - systemctl
          - list-unit-files
          - --no-legend
          - --state=enabled
          - zfs-auto-snapshot-*.timer
      register: autosnap_timer_scan
      changed_when: false
      failed_when: false
      when: ansible_system == "Linux"

    - name: Linux — record the timers being disabled
      ansible.builtin.copy:
        dest: "{{ timer_state_file }}"
        content: "{{ autosnap_enabled_timers | join('\n') }}\n"
        mode: "0644"
      when: ansible_system == "Linux" and autosnap_enabled_timers | length > 0

    - name: Linux — stop and disable zfs-auto-snapshot systemd timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ autosnap_enabled_timers }}"
      when: ansible_system == "Linux"

    - name: Linux — disable zfs-auto-snapshot cron entries
      ansible.builtin.command:
        argv: [mv, "{{ item }}", "{{ item }}.dumpstore-disabled"]
        removes: "{{ item }}"
      loop: "{{ autosnap_cron_files }}"
      when: ansible_system == "Linux"

    - name: FreeBSD — disable daily_zfs_snapshot_enable in periodic.conf
      ansible.builtin.lineinfile:
        path: /etc/periodic.conf
        regexp: '^daily_zfs_snapshot_enable\s*='
        line: 'daily_zfs_snapshot_enable="NO"'
        create: true
        mode: "0644"
      when: ansible_system == "FreeBSD"

    - name: FreeBSD — also disable in periodic.conf.local if it exists
      ansible.builtin.lineinfile:
        path: /etc/periodic.conf.local
        regexp: '^daily_zfs_snapshot_enable\s*='
        line: 'daily_zfs_snapshot_enable="NO"'
        state: present
      when: ansible_system == "FreeBSD"
      register: fbsd_local
      failed_when: fbsd_local.failed | default(false) and 'does not exist' not in (fbsd_local.msg | default(''))
