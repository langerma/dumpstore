---
# Re-enable the OS auto-snapshot daemon so dumpstore can step back. Exact
# inverse of auto_snapshot_takeover.yml:
#   cron: rename <file>.dumpstore-disabled back (never over a file the
#     package has since recreated).
#   systemd timers: re-enable the timers recorded in timer_state_file. With
#     no record (takeover by an older dumpstore), enable the installed ones.
#     Timers that are not installed are never touched.
#   FreeBSD periodic.conf: `sysrc -f` puts back each recorded file/variable/
#     value from periodic_state_file (values are rewritten quoted, as sysrc
#     does). With no record (takeover by an older dumpstore), set
#     daily_zfs_snapshot_enable="YES" in /etc/periodic.conf, as release
#     always did.
# Does NOT reinstall the package.
#
# Required extra vars:
#   timer_state_file    - timer record written by auto_snapshot_takeover.yml
#   periodic_state_file - periodic.conf record written by auto_snapshot_takeover.yml
- name: Release auto-snapshot execution back to the OS daemon
  hosts: localhost
  gather_facts: true
  vars:
    autosnap_cron_files:
      - /etc/cron.d/zfs-auto-snapshot
      - /etc/cron.hourly/zfs-auto-snapshot
      - /etc/cron.daily/zfs-auto-snapshot
      - /etc/cron.weekly/zfs-auto-snapshot
      - /etc/cron.monthly/zfs-auto-snapshot
    autosnap_known_timers:
      - zfs-auto-snapshot-frequent.timer
      - zfs-auto-snapshot-hourly.timer
      - zfs-auto-snapshot-daily.timer
      - zfs-auto-snapshot-weekly.timer
      - zfs-auto-snapshot-monthly.timer
    autosnap_installed_timers: >-
      {{ (autosnap_timer_scan.stdout_lines | default([]))
         | map('split') | map('first')
         | select('in', autosnap_known_timers) | list }}
    autosnap_release_timers: >-
      {{ ((autosnap_timer_record.stdout_lines | default([]))
          if (autosnap_timer_record.rc | default(1)) == 0
          else autosnap_installed_timers)
         | select('in', autosnap_installed_timers) | list }}
    autosnap_periodic_files:
      - /etc/periodic.conf
      - /etc/periodic.conf.local
      - /usr/local/etc/periodic.conf
    autosnap_periodic_vars:
      - hourly_zfs_snapshot_enable
      - daily_zfs_snapshot_enable
      - weekly_zfs_snapshot_enable
      - monthly_zfs_snapshot_enable
    autosnap_periodic_have_record: "{{ (autosnap_periodic_record.rc | default(1)) == 0 }}"
  tasks:
    - name: Assert required vars are defined
      ansible.builtin.assert:
        that:
          - timer_state_file is defined and timer_state_file | length > 0
          - periodic_state_file is defined and periodic_state_file | length > 0
        fail_msg: "timer_state_file and periodic_state_file are required"

    - name: Linux — restore zfs-auto-snapshot cron entries
      ansible.builtin.command:
        argv: [mv, "{{ item }}.dumpstore-disabled", "{{ item }}"]
        removes: "{{ item }}.dumpstore-disabled"
        creates: "{{ item }}"
      loop: "{{ autosnap_cron_files }}"
      when: ansible_system == "Linux"

    - name: Linux — read the timers takeover disabled
      ansible.builtin.command:
        argv: [cat, "{{ timer_state_file }}"]
      register: autosnap_timer_record
      changed_when: false
      failed_when: false
      when: ansible_system == "Linux"

    - name: Linux — detect installed zfs-auto-snapshot systemd timers
      ansible.builtin.command:
        argv:
          - systemctl
          - list-unit-files
          - --no-legend
          - zfs-auto-snapshot-*.timer
      register: autosnap_timer_scan
      changed_when: false
      failed_when: false
      when: ansible_system == "Linux"

    - name: Linux — enable and start zfs-auto-snapshot systemd timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ autosnap_release_timers }}"
      when: ansible_system == "Linux"

    - name: Linux — remove the takeover record
      ansible.builtin.file:
        path: "{{ timer_state_file }}"
        state: absent
      when: ansible_system == "Linux"

    - name: FreeBSD — read the settings takeover disabled
      ansible.builtin.command:
        argv: [cat, "{{ periodic_state_file }}"]
      register: autosnap_periodic_record
      changed_when: false
      failed_when: false
      when: ansible_system == "FreeBSD"

    # Only files and variables takeover itself can record are restored.
    - name: FreeBSD — restore the recorded zfs-periodic settings
      ansible.builtin.command:
        argv: [sysrc, -f, "{{ item.file }}", "{{ item.var }}={{ item.value }}"]
      loop: "{{ (autosnap_periodic_record.stdout | from_json) if autosnap_periodic_have_record else [] }}"
      loop_control:
        label: "{{ item.file }} {{ item.var }}"
      when: >-
        ansible_system == "FreeBSD"
        and item.file in autosnap_periodic_files and item.var in autosnap_periodic_vars

    - name: FreeBSD — no record, re-enable daily_zfs_snapshot_enable in periodic.conf
      ansible.builtin.command:
        argv: [sysrc, -f, /etc/periodic.conf, daily_zfs_snapshot_enable=YES]
      when: ansible_system == "FreeBSD" and not autosnap_periodic_have_record

    - name: FreeBSD — remove the takeover record
      ansible.builtin.file:
        path: "{{ periodic_state_file }}"
        state: absent
      when: ansible_system == "FreeBSD"
